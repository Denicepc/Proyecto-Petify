<div>
  <h3>Buscador de Compras</h3>
  <input type="text" [(ngModel)]="productoBuscado" placeholder="Nombre del producto">
  <button (click)="buscarProducto()">Buscar</button>

  <p *ngIf="numeroDeProductos > 0">Número total de compras del producto: {{ numeroDeProductos }}</p>
  <p *ngIf="numeroDeProductos === 0 && productoBuscado">No se encontraron compras del producto.</p>
</div>
